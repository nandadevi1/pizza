<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dingo Pizza</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Dingo Pizza</h1>
      <p class="subtitle">Neapolitan pizza dough calculator</p>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab-btn is-active" data-tab="calculator" role="tab" aria-selected="true">Calculator</button>
      <button class="tab-btn" data-tab="details" role="tab" aria-selected="false">Details</button>
    </nav>

    <section id="calculator" class="tab-panel" role="tabpanel">
      <section class="card">
        <div class="inputs">
          <label for="flour-type">Flour Type</label>
          <select id="flour-type">
            <option value="caputo" selected>Caputo 00 Pizzeria</option>
            <option value="t65">Spanish T65</option>
          </select>

          <label for="flour">Flour (grams)</label>
          <input type="number" id="flour" min="90" step="1" value="180" placeholder="e.g. 180" />

          <label for="temp">Ambient Temperature (°C)</label>
          <input type="number" id="temp" min="0" max="45" step="0.5" value="21" placeholder="e.g. 21" />

          <div class="button-row">
            <button id="calculate">Calculate</button>
            <button id="reset" disabled>RESET</button>
          </div>
        </div>
      </section>

      <section class="card" id="ingredients"></section>
    </section>

    <section id="details" class="tab-panel" role="tabpanel" hidden>
      <section class="card">
        <h2 class="ingredients-title">Calculation Settings</h2>
        <p class="note">Defaults use the HOME-OVEN-220-7C profile. Changes create a custom profile.</p>
        <div class="inputs settings-inputs">
          <label for="oven-temp">Oven Temperature (°C)</label>
          <input type="number" id="oven-temp" min="150" max="350" step="5" value="220" />

          <label for="fridge-temp">Refrigerator Temperature (°C)</label>
          <input type="number" id="fridge-temp" min="0" max="15" step="0.5" value="7" />

          <label for="hydration-mode">Hydration Mode</label>
          <select id="hydration-mode">
            <option value="auto" selected>Auto recommendation</option>
            <option value="manual">Manual override</option>
          </select>
          <input type="number" id="manual-hydration" min="40" max="100" step="0.1" value="62" hidden placeholder="Hydration (%)" />

        </div>
      </section>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
